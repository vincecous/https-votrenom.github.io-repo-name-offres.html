<!DOCTYPE html>
<html>
<head>
  <title>Test Ultra Simple</title>
  <style>
    body { background: #000; color: #fff; font-family: Arial; padding: 20px; }
    button { padding: 20px; font-size: 18px; cursor: pointer; margin: 10px; background: #00cc00; color: #000; }
    #status { position: fixed; top: 10px; right: 10px; background: #00ccff; padding: 20px; font-size: 16px; }
    #list { margin-top: 30px; border: 2px solid #fff; padding: 20px; }
    .item { background: #333; padding: 10px; margin: 5px 0; }
  </style>
</head>
<body>
  <div id="status">Chargement...</div>
  <button onclick="addItem()">CLIC MOI POUR AJOUTER</button>
  <div id="list"></div>

  <script>
    let itemCount = 0;
    
    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
    
    function addItem() {
      itemCount++;
      const list = document.getElementById('list');
      const item = document.createElement('div');
      item.className = 'item';
      item.textContent = 'Item #' + itemCount;
      list.appendChild(item);
      updateStatus('Ajouté! Total: ' + itemCount);
    }
    
    updateStatus('PRÊT - cliquez le bouton vert');
  </script>
</body>
</html>
