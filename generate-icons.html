<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur d'icônes PWA</title>
</head>
<body>
  <h1>Icône générée pour l'app</h1>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <br><br>
  <button onclick="downloadIcon(192)">Télécharger icon-192.png</button>
  <button onclick="downloadIcon(512)">Télécharger icon-512.png</button>

  <script>
    function createIcon(size) {
      const canvas = document.getElementById('canvas' + size);
      const ctx = canvas.getContext('2d');
      
      // Fond vert
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(0, 0, size, size);
      
      // Texte TM
      ctx.fillStyle = 'white';
      ctx.font = 'bold ' + (size * 0.4) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TM', size / 2, size / 2);
    }
    
    function downloadIcon(size) {
      const canvas = document.getElementById('canvas' + size);
      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Génère les icônes au chargement
    createIcon(192);
    createIcon(512);
  </script>
</body>
</html>
